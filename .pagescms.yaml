media:
  input: public/images
  output: /images

content:
  - name: posts
    label: Blog Posts
    path: _posts
    type: collection
    filename: "{year}-{month}-{day}-{slug}.md"

    fields:
      - name: title
        label: Title
        type: string

      - name: date
        label: Date
        type: date

      - name: image
        label: Featured Image
        type: image   # 👈 IMPORTANT

      - name: description
        label: Description
        type: string

      - name: body
        label: Content
        type: richtext
